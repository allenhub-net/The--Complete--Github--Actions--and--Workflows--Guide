name: events

on: 
  push:

  pull_request:
    types: 
      - opened
      - assigned
      - synchronize
      - reopened

  issues:
    types:
      - opened

  workflow_dispatch:

jobs:
  checkout-test:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "GITHUB_SHA:${GITHUB_SHA}"
          echo "GITHUB_REF:${GITHUB_REF}"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      
  